# Publica a pasta site/ no droplet a cada push na branch main.
# Segredos necessarios (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST         IP ou nome do servidor (143.198.177.192)
#   DEPLOY_USER         usuario de publicacao (deploy)
#   DEPLOY_SSH_KEY      chave privada SSH so para publicar
#   DEPLOY_KNOWN_HOSTS  linha do known_hosts do servidor
# Veja deploy/criar-usuario-deploy.sh e o README.

name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Conferir os arquivos do site
        run: |
          test -f site/index.html
          test -f site/obras/derivadas-ao-vivo/index.html
          echo "Arquivos a publicar:"
          find site -type f | sort

      - name: Preparar a chave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Enviar com rsync
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -rtvz --delete \
            --exclude ".*" \
            --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            site/ "${DEPLOY_USER}@${DEPLOY_HOST}:./"

      - name: Apagar a chave
        if: always()
        run: rm -f ~/.ssh/deploy
