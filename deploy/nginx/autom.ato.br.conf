# autom.ato.br: site estatico
# Copiado para /etc/nginx/sites-available/ pelo instalar-servidor.sh.
# O certbot acrescenta o bloco HTTPS depois.

server {
    listen 80;
    listen [::]:80;
    server_name autom.ato.br www.autom.ato.br;

    root /var/www/autom.ato.br;
    index index.html;

    # A obra DERIVADAS AO VIVO usa a camera do proprio site.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html)$ {
        expires 5m;
    }

    # Nada de arquivos ocultos (.git, .env etc.).
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/autom.ato.br.access.log;
    error_log  /var/log/nginx/autom.ato.br.error.log;
}
